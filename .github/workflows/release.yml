name: Test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: go test -race ./...
      - run: python -m pip install Pillow==12.2.0
      - run: python -m unittest discover -p test_worker.py
  build:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-14, goos: darwin, goarch: arm64, cc: clang}
          - {runner: macos-14, goos: darwin, goarch: amd64, cc: 'clang -arch x86_64'}
          - {runner: ubuntu-latest, goos: linux, goarch: amd64, cc: gcc}
          - {runner: ubuntu-24.04-arm, goos: linux, goarch: arm64, cc: gcc}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify tag and package
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CC: ${{ matrix.cc }}
        run: |
          test "$GITHUB_REF_NAME" = "v$(cat VERSION)"
          sh scripts/package.sh
      - uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/*.tar.gz
          if-no-files-found: error
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Check packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          test "$(find . -name '*.tar.gz' | wc -l)" -eq 4
          sha256sum *.tar.gz > SHA256SUMS
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes ./*.tar.gz SHA256SUMS
